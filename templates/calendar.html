<!doctype html>
<html>
    <head>
        <title>Calendar</title>
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js"></script>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <div class="container mt-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>My Calendar</h2>
                <button
                    class="btn btn-outline-danger btn-sm"
                    onclick="logout()"
                >
                    Logout
                </button>
            </div>
            <div id="calendar"></div>
        </div>

        <div
            class="modal fade"
            id="editEventModal"
            tabindex="-1"
            aria-hidden="true"
        >
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Event</h5>
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"
                        ></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editEventId" />

                        <label class="form-label">Event Name</label>
                        <input
                            type="text"
                            id="editHeader"
                            class="form-control mb-2"
                        />

                        <label class="form-label">Description</label>
                        <textarea
                            id="editDesc"
                            class="form-control mb-3"
                        ></textarea>

                        <div class="row">
                            <div class="col">
                                <label class="form-label">Start Time</label>
                                <input
                                    type="time"
                                    id="editStart"
                                    class="form-control"
                                />
                            </div>
                            <div class="col">
                                <label class="form-label">End Time</label>
                                <input
                                    type="time"
                                    id="editEnd"
                                    class="form-control"
                                />
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer d-flex justify-content-between">
                        <button
                            type="button"
                            class="btn btn-danger"
                            onclick="deleteEvent()"
                        >
                            Delete Event
                        </button>
                        <button
                            type="button"
                            class="btn btn-primary"
                            onclick="saveEventDetails()"
                        >
                            Save Changes
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            let calendar; // Make globally available for the modal functions

            document.addEventListener("DOMContentLoaded", function () {
                const userId = localStorage.getItem("user_id");
                if (!userId) {
                    window.location.href = "/";
                    return;
                }

                var calendarEl = document.getElementById("calendar");
                calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: "timeGridWeek",
                    headerToolbar: {
                        left: "prev,next today",
                        center: "title",
                        right: "timeGridDay,timeGridWeek,dayGridMonth",
                    },

                    // 1. FETCH
                    events: async function (
                        fetchInfo,
                        successCallback,
                        failureCallback,
                    ) {
                        try {
                            const response = await fetch("/get_events", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ user_id: userId }),
                            });
                            const data = await response.json();

                            const formattedEvents = data.events.map((e) => {
                                const baseDate = e.date.split(" ")[0];
                                return {
                                    id: e.id,
                                    title: e.header,
                                    description: e.description,
                                    start: `${baseDate}T${e.start}:00`,
                                    end: `${baseDate}T${e.end}:00`,
                                };
                            });
                            successCallback(formattedEvents);
                        } catch (error) {
                            failureCallback(error);
                        }
                    },

                    // 2. CREATE (Drag)
                    selectable: true,
                    select: async function (info) {
                        let title = prompt("Enter Event Title:");
                        if (title) {
                            const year = info.start.getFullYear();
                            const month = String(
                                info.start.getMonth() + 1,
                            ).padStart(2, "0");
                            const day = String(info.start.getDate()).padStart(
                                2,
                                "0",
                            );

                            const response = await fetch("/create_event", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    header: title,
                                    description: "",
                                    date: `${year}-${month}-${day} 00:00:00`,
                                    start: info.start
                                        .toTimeString()
                                        .substring(0, 5),
                                    end: info.end
                                        .toTimeString()
                                        .substring(0, 5),
                                    user_id: userId,
                                }),
                            });
                            if (response.ok) calendar.refetchEvents();
                        }
                        calendar.unselect();
                    },

                    editable: true,
                    eventResizableFromStart: true,
                    eventResize: async function (info) {
                        const year = info.event.start.getFullYear();
                        const month = String(
                            info.event.start.getMonth() + 1,
                        ).padStart(2, "0");
                        const day = String(info.event.start.getDate()).padStart(
                            2,
                            "0",
                        );
                        const endObj =
                            info.event.end ||
                            new Date(
                                info.event.start.getTime() + 60 * 60 * 1000,
                            );

                        const response = await fetch("/update_event", {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                id: info.event.id,
                                header: info.event.title,
                                description:
                                    info.event.extendedProps.description || "",
                                date: `${year}-${month}-${day} 00:00:00`,
                                start: info.event.start
                                    .toTimeString()
                                    .substring(0, 5),
                                end: endObj.toTimeString().substring(0, 5),
                            }),
                        });
                        eventDrop: async function(info) {
                                                const year = info.event.start.getFullYear();
                                                const month = String(info.event.start.getMonth() + 1).padStart(2, '0');
                                                const day = String(info.event.start.getDate()).padStart(2, '0');
                                                const endObj = info.event.end || new Date(info.event.start.getTime() + 60 * 60 * 1000);

                                                const response = await fetch('/update_event', {
                                                    method: 'PUT',
                                                    headers: { 'Content-Type': 'application/json' },
                                                    body: JSON.stringify({
                                                        id: parseInt(info.event.id),
                                                        header: info.event.title,
                                                        description: info.event.extendedProps.description || "",
                                                        date: `${year}-${month}-${day} 00:00:00`,
                                                        start: info.event.start.toTimeString().substring(0, 5),
                                                        end: endObj.toTimeString().substring(0, 5)
                                                    })
                                                });

                                                if (!response.ok) {
                                                    alert("Failed to move event.");
                                                    info.revert();
                                                }
                                            }
                        if (!response.ok) info.revert();
                    },

                    eventClick: function (info) {
                        document.getElementById("editEventId").value =
                            info.event.id;
                        document.getElementById("editHeader").value =
                            info.event.title;
                        document.getElementById("editDesc").value =
                            info.event.extendedProps.description || "";
                        document.getElementById("editStart").value =
                            info.event.start.toTimeString().substring(0, 5);

                        const endObj =
                            info.event.end ||
                            new Date(
                                info.event.start.getTime() + 60 * 60 * 1000,
                            );
                        document.getElementById("editEnd").value = endObj
                            .toTimeString()
                            .substring(0, 5);

                        var editModal = new bootstrap.Modal(
                            document.getElementById("editEventModal"),
                        );
                        editModal.show();
                    },
                });
                calendar.render();
            });

            async function saveEventDetails() {
                const eventId = document.getElementById("editEventId").value;
                const eventObj = calendar.getEventById(eventId);

                const year = eventObj.start.getFullYear();
                const month = String(eventObj.start.getMonth() + 1).padStart(
                    2,
                    "0",
                );
                const day = String(eventObj.start.getDate()).padStart(2, "0");

                const response = await fetch("/update_event", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        id: eventId,
                        header: document.getElementById("editHeader").value,
                        description: document.getElementById("editDesc").value,
                        start: document.getElementById("editStart").value,
                        end: document.getElementById("editEnd").value,
                        date: `${year}-${month}-${day} 00:00:00`,
                    }),
                });

                if (response.ok) {
                    bootstrap.Modal.getInstance(
                        document.getElementById("editEventModal"),
                    ).hide();
                    calendar.refetchEvents();
                }
            }

            async function deleteEvent() {
                if (confirm("Are you sure you want to delete this event?")) {
                    const eventId =
                        document.getElementById("editEventId").value;
                    const response = await fetch("/delete_event", {
                        method: "DELETE",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ id: eventId }),
                    });

                    if (response.ok) {
                        bootstrap.Modal.getInstance(
                            document.getElementById("editEventModal"),
                        ).hide();
                        calendar.refetchEvents();
                    }
                }
            }

            function logout() {
                localStorage.removeItem("user_id");
                window.location.href = "/";
            }
        </script>
    </body>
</html>
