<!doctype html>
<html>
    <head>
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js"></script>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="container mt-3">
            <div id="calendar"></div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const userId = localStorage.getItem("user_id");

                if (!userId) {
                    alert("Please log in first!");
                    window.location.href = "/";
                    return;
                }

                var calendarEl = document.getElementById("calendar");
                var calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: "timeGridWeek",
                    headerToolbar: {
                        left: "prev,next today",
                        center: "title",
                        right: "timeGridDay,timeGridWeek,dayGridMonth",
                    },

                    events: async function (
                        fetchInfo,
                        successCallback,
                        failureCallback,
                    ) {
                        try {
                            const response = await fetch("/get_events", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ user_id: userId }),
                            });
                            const data = await response.json();

                            // Map the backend data to FullCalendar format
                            const formattedEvents = data.events.map((e) => {
                                const baseDate = e.date.split(" ")[0];
                                return {
                                    id: e.id,
                                    title: e.header,
                                    // Combine date with start and end times
                                    start: `${baseDate}T${e.start}:00`,
                                    end: `${baseDate}T${e.end}:00`,
                                };
                            });

                            successCallback(formattedEvents);
                        } catch (error) {
                            console.error("Error fetching events:", error);
                            failureCallback(error);
                        }
                    },

                    selectable: true,
                    select: async function (info) {
                        let title = prompt("Enter Event Title:");

                        if (title) {
                            const year = info.start.getFullYear();
                            const month = String(
                                info.start.getMonth() + 1,
                            ).padStart(2, "0");
                            const day = String(info.start.getDate()).padStart(
                                2,
                                "0",
                            );

                            const dateStr = `${year}-${month}-${day} 00:00:00`;

                            const startTimeStr = info.startStr
                                .split("T")[1]
                                .substring(0, 5);
                            const endTimeStr = info.endStr
                                .split("T")[1]
                                .substring(0, 5);

                            const response = await fetch("/create_event", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    header: title,
                                    description: "Created via Calendar UI",
                                    date: dateStr,
                                    start: startTimeStr,
                                    end: endTimeStr,
                                    user_id: userId,
                                }),
                            });

                            if (response.ok) {
                                calendar.refetchEvents();
                            } else {
                                alert("Failed to create event.");
                            }
                        }

                        calendar.unselect();
                    },
                    editable: true,
                    eventResizableFromStart: true,

                    eventResize: async function (info) {
                        const eventId = info.event.id;
                        const year = info.event.start.getFullYear();
                        const month = String(
                            info.event.start.getMonth() + 1,
                        ).padStart(2, "0");
                        const day = String(info.event.start.getDate()).padStart(
                            2,
                            "0",
                        );
                        const dateStr = `${year}-${month}-${day} 00:00:00`;

                        const startTimeStr = info.event.start
                            .toTimeString()
                            .substring(0, 5);

                        const endObj =
                            info.event.end ||
                            new Date(
                                info.event.start.getTime() + 60 * 60 * 1000,
                            );
                        const endTimeStr = endObj
                            .toTimeString()
                            .substring(0, 5);

                        try {
                            const response = await fetch("/update_event", {
                                method: "PUT",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    id: eventId,
                                    header: info.event.title,
                                    description:
                                        info.event.extendedProps.description ||
                                        "Updated via drag",
                                    date: dateStr,
                                    start: startTimeStr,
                                    end: endTimeStr,
                                }),
                            });

                            if (!response.ok) {
                                alert("Failed to update event in database.");
                                info.revert();
                            }
                        } catch (error) {
                            console.error("Error updating event:", error);
                            alert("Server error.");
                            info.revert();
                        }
                    },
                });

                calendar.render();
            });
        </script>
    </body>
</html>
